# Só as actions do CI: elas ficam fixadas por SHA em ci.yml e precisam de
# alguém que avise quando sai versão nova. Dependências npm seguem pelo
# `npm audit` do CI e pelos alertas de segurança do GitHub.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
