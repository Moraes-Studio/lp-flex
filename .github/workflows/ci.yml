name: CI

# Roda em todo PR e em push pra main/develop — gate mínimo antes de merge
# (SDD.md §12 Etapa 7). `develop` é a branch de trabalho (Vercel Preview,
# aprovação do cliente antes de produção — docs/tasks.md, Etapa 8); `main`
# só recebe merge depois de aprovado. Gatilho é `pull_request` (não
# `pull_request_target`) de propósito: workflow nunca deve rodar com
# permissão/segredo de push em código vindo de fork, e este arquivo não
# referencia nenhum `secrets.*` — não existe segredo de produção pra vazar
# (RULES.md: "nenhum secret de produção deve existir como GitHub Secret
# acessível a um workflow que o agente possa disparar sozinho"). Os
# valores de env abaixo são os mesmos de sandbox do `.env.test` local —
# nunca uma chave real.
"on":
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

# Actions de terceiros fixadas por SHA de commit (tag pode ser movida por
# quem controla o repo da action; SHA não). A versão fica no comentário e o
# Dependabot (.github/dependabot.yml) abre PR quando sai versão nova.
# `persist-credentials: false` no checkout: nenhum job faz push, então o
# token não precisa ficar disponível pros passos seguintes. Runner fixo em
# ubuntu-24.04 pra não migrar sozinho quando `ubuntu-latest` virar 26 —
# atualizar aqui de propósito, junto com `playwright install --with-deps`.

env:
  # Sandbox/teste — idênticos ao `.env.test` do repo local (RULES.md:
  # "`.env.test` guarda só credenciais de sandbox... nunca uma chave que
  # move dinheiro de verdade"). `.env.test`/`.env.local` não são versionados
  # (.gitignore), por isso são recriados aqui (./.github/actions/setup-env-test)
  # a partir destes valores.
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  NEXT_PUBLIC_WHATSAPP_NUMBER: '5511900000000'
  NEXT_PUBLIC_INSTAGRAM_URL: https://instagram.com/test
  NEXTFIT_API_KEY: sandbox-key
  PAYMENT_GATEWAY_CLIENT_SECRET: sandbox-secret

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-env-test
        with:
          site-url: ${{ env.NEXT_PUBLIC_SITE_URL }}
          whatsapp-number: ${{ env.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          instagram-url: ${{ env.NEXT_PUBLIC_INSTAGRAM_URL }}
          nextfit-api-key: ${{ env.NEXTFIT_API_KEY }}
          payment-gateway-client-secret: ${{ env.PAYMENT_GATEWAY_CLIENT_SECRET }}
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      # Só dependências de produção (`--omit=dev`): o que vai pro site.
      # Ferramentas de dev rodam só com entrada nossa e às vezes ficam dias
      # sem versão corrigida (ex.: `braces` em out/2026) — com o audit
      # completo o CI ficaria vermelho sem ação possível. Em 2026-10-26 o
      # audit completo estava zerado; conferir local com `npm audit`.
      - name: npm audit (falha em vulnerabilidade alta/crítica de produção)
        run: npm audit --omit=dev --audit-level=high

  e2e:
    needs: lint-typecheck-test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # `browser` é o motor real que cada projeto do playwright.config.ts
        # usa — instalar só ele evita baixar Chromium numa leg que só roda
        # WebKit (e vice-versa).
        include:
          - project: 'Desktop Chrome'
            browser: chromium
          - project: 'Mobile Chrome'
            browser: chromium
          - project: 'Mobile Safari'
            browser: webkit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-env-test
        with:
          site-url: ${{ env.NEXT_PUBLIC_SITE_URL }}
          whatsapp-number: ${{ env.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          instagram-url: ${{ env.NEXT_PUBLIC_INSTAGRAM_URL }}
          nextfit-api-key: ${{ env.NEXTFIT_API_KEY }}
          payment-gateway-client-secret: ${{ env.PAYMENT_GATEWAY_CLIENT_SECRET }}
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npx playwright test --project="${{ matrix.project }}"
        env:
          CI: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report-${{ strategy.job-index }}
          path: playwright-report/
          retention-days: 14

  lighthouse:
    # Gate de Lighthouse 95+ em Performance/Accessibility/Best
    # Practices/SEO (SDD.md §10, §12 Etapa 7) — preset desktop de
    # propósito: rodado local com preset mobile (throttling simulado) o
    # score de Performance ficou instável no sandbox (89 numa rodada, 100
    # noutra, mesma build) por variação de CPU da máquina, não por
    # regressão real de código — LCP com "element render delay" muito
    # acima do breakdown observado é sintoma clássico de simulação
    # distorcida em ambiente compartilhado. Preset desktop deu 100/100/100/100
    # de forma repetível. Verificar mobile de verdade contra a URL real da
    # Vercel antes do lançamento (`docs/tasks.md`) — não dá pra confiar
    # nesse número rodando local/CI.
    # `numberOfRuns: 3` (.lighthouserc.json): com 1 run só, a home caiu pra
    # 94 em 2026-10-08 por TBT de 180ms, todo ele hidratação do React/Next
    # (nenhum chunk do site acima de 78ms) no runner compartilhado.
    needs: lint-typecheck-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: ./.github/actions/setup-env-test
        with:
          site-url: ${{ env.NEXT_PUBLIC_SITE_URL }}
          whatsapp-number: ${{ env.NEXT_PUBLIC_WHATSAPP_NUMBER }}
          instagram-url: ${{ env.NEXT_PUBLIC_INSTAGRAM_URL }}
          nextfit-api-key: ${{ env.NEXTFIT_API_KEY }}
          payment-gateway-client-secret: ${{ env.PAYMENT_GATEWAY_CLIENT_SECRET }}
      - run: npm run build
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./.lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
